services:
  socks5lb:
    build:
      context: .
    image: ghcr.io/mingcheng/socks5lb
    environment:
      CHECK_TIME_INTERVAL: 60
      DEBUG: "false"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - 1080:1080
    volumes:
      - ./socks5lb.yml:/etc/socks5lb.yml:ro
    restart: unless-stopped
    stop_grace_period: 10s
