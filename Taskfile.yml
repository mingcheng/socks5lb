version: '3'

vars:
  BINARY_NAME: socks5lb{{exeExt}}
  PACKAGE_NAME: github.com/mingcheng/socks5lb

tasks:
  default:
    cmds:
      - task: check
      - task: build

  build:
    sources:
      - ./cmd/socks5lb/*.go
      - ./*.go
      - go.mod
      - go.sum
    generates:
      - '{{.BINARY_NAME}}'
    cmds:
      - >
        go build -o {{.BINARY_NAME}} -ldflags="
        -X '{{.PACKAGE_NAME}}.BuildCommit={{.GIT_COMMIT}}'
        -X '{{.PACKAGE_NAME}}.BuildDate={{now}}'
        -X '{{.PACKAGE_NAME}}.Version={{now | date "2006-01-02"}}'"
        ./cmd/socks5lb
    vars:
      GIT_COMMIT:
        sh: git rev-parse --short HEAD
  test:
    cmds:
      - go test ./...

  race:
    env:
      CGO_ENABLED: '1'
    cmds:
      - go test -race ./...

  vet:
    cmds:
      - go vet ./...

  fmt:
    cmds:
      - gofmt -w .

  fmt-check:
    cmds:
      - |
        files="$(gofmt -l .)" || exit $?
        if [ -n "$files" ]; then
          printf 'Run gofmt on:\n%s\n' "$files"
          exit 1
        fi

  check:
    cmds:
      - task: fmt-check
      - task: vet
      - task: test
      - task: race

  clean:
    aliases:
      - cleanup
      - clear
    cmds:
      - go clean ./...
    silent: true
