server:
  http:
    addr: ":8080"
  socks5:
    addr: ":1080"
  connections:
    max_connections: 0
    max_concurrent_dials: 0
    dial_attempts: 1
    dial_timeout: 10
  health_check:
    concurrency: 1
    check_on_start: false
    jitter_percent: 0
    failure_threshold: 1
    success_threshold: 1
  tproxy:
    addr: ""
backends:
  #  - addr: 192.168.100.254:1086
  #    check_config:
  #      check_url: https://www.google.com/robots.txt
  #      initial_alive: true
  #      timeout: 3
  - addr: 192.168.1.254:1086
    check_config:
      check_url: https://twitter.com/robots.txt
      initial_alive: true
      timeout: 3
  - addr: 172.16.1.254:1086
    check_config:
      check_url: https://twitter.com/robots.txt
      initial_alive: true
      timeout: 3
  - addr: host.docker.internal:1081
    check_config:
      check_url: https://www.google.com/robots.txt
      initial_alive: false
      timeout: 6
  - addr: host.docker.internal:1082
    check_config:
      check_url: https://www.google.com/robots.txt
      initial_alive: false
      timeout: 6
